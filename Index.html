<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="theme-color" content="#0a0f1e"/>
<title>Lucas Trade Intel — Paper Lab</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0a0f1e; --panel:#111827; --panel2:#1a2235;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.13);
  --gold:#c9a84c; --gold-lt:#f0d080;
  --ink:#e8edf5; --mut:#8899bb; --dim:#4a5a7a;
  --up:#00c896; --dn:#f0465a; --amber:#f59e0b; --blue:#3b82f6;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;font-size:14px}
.wrap{max-width:480px;margin:0 auto;min-height:100vh}
.mono{font-family:'DM Mono',monospace}
.serif{font-family:'DM Serif Display',serif}
header{padding:16px 16px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(10,15,30,.92);backdrop-filter:blur(14px);z-index:40}
.brand{display:flex;align-items:center;gap:11px}
.mark{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,var(--gold),var(--gold-lt));display:flex;align-items:center;justify-content:center;box-shadow:0 0 18px rgba(201,168,76,.35)}
.mark span{font-family:'DM Serif Display',serif;font-style:italic;color:#0a0f1e;font-size:17px}
.brand h1{font-family:'DM Serif Display',serif;font-weight:400;font-size:15px;color:var(--gold-lt);line-height:1}
.brand small{display:block;font-family:'DM Mono',monospace;font-size:8px;letter-spacing:3px;color:var(--dim);margin-top:3px}
.stamp{font-family:'DM Mono',monospace;font-size:9px;color:var(--dim);margin-top:9px}
.stamp b{color:var(--mut);font-weight:500}
nav{display:flex;border-bottom:1px solid var(--line);position:sticky;top:71px;background:var(--bg);z-index:39}
nav button{flex:1;background:none;border:none;border-bottom:2px solid transparent;color:var(--mut);font:600 12px 'DM Sans';padding:11px 4px;cursor:pointer}
nav button.on{color:var(--gold-lt);border-bottom-color:var(--gold)}
main{padding:16px;padding-bottom:56px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.card>.hd{padding:11px 14px;border-bottom:1px solid var(--line);font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;color:var(--mut)}
.card>.bd{padding:13px 14px}
.chip{display:inline-block;font-family:'DM Mono',monospace;font-size:10px;border-radius:6px;padding:2px 8px;border:1px solid;white-space:nowrap}
.c-up{color:var(--up);border-color:rgba(0,200,150,.3);background:rgba(0,200,150,.08)}
.c-dn{color:var(--dn);border-color:rgba(240,70,90,.3);background:rgba(240,70,90,.08)}
.c-am{color:var(--amber);border-color:rgba(245,158,11,.3);background:rgba(245,158,11,.08)}
.c-mut{color:var(--mut);border-color:var(--line2);background:transparent}
.c-blue{color:#7ab3ff;border-color:rgba(59,130,246,.35);background:rgba(59,130,246,.08)}
/* Alpha strip — the one gold moment */
.alpha{padding:22px 16px 18px;text-align:center;border-bottom:1px solid var(--line)}
.alpha .big{font-family:'DM Serif Display',serif;font-size:44px;line-height:1;color:var(--gold-lt)}
.alpha .big.neg{color:var(--dn)}
.alpha .lab{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2.5px;color:var(--dim);margin-top:7px}
.alpha .sub{font-size:11px;color:var(--mut);margin-top:4px}
.seg{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.seg button{background:none;border:1px solid var(--line2);border-radius:8px;color:var(--mut);font:500 11px 'DM Sans';padding:6px 11px;cursor:pointer}
.seg button.on{border-color:var(--gold);color:var(--gold-lt);background:rgba(201,168,76,.1)}
.statgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.stat{background:var(--panel2);border-radius:9px;padding:9px 8px;text-align:center}
.stat .v{font-family:'DM Mono',monospace;font-size:15px;font-weight:500}
.stat .k{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:1.5px;color:var(--dim);margin-top:3px}
.combo{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.cell{border-radius:10px;padding:10px 8px;text-align:center;border:1px solid var(--line)}
.cell.ok{background:var(--panel2)}
.cell.thin{border-style:dashed;border-color:var(--line2);background:transparent}
.cell .t{font-family:'DM Mono',monospace;font-size:9px;color:var(--mut);letter-spacing:1px}
.cell .w{font-family:'DM Serif Display',serif;font-size:19px;margin-top:3px}
.cell .n{font-family:'DM Mono',monospace;font-size:9px;color:var(--dim);margin-top:2px}
.cell.thin .w{color:var(--dim);font-size:13px;font-family:'DM Mono',monospace;margin-top:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
canvas{width:100%;height:120px;display:block}
.slider{width:100%;accent-color:var(--gold)}
.note{font-size:11px;color:var(--mut);line-height:1.6}
.warn{font-size:11px;color:var(--amber);line-height:1.5}
.empty{text-align:center;padding:44px 20px;color:var(--dim)}
.empty .serif{font-size:17px;color:var(--mut);margin-bottom:8px}
.tk{font-weight:600;font-size:14px}
.px{font-family:'DM Mono',monospace;font-size:12px;color:var(--mut)}
.scorebar{height:4px;background:var(--panel2);border-radius:99px;overflow:hidden;flex:1}
.scorebar i{display:block;height:100%;border-radius:99px}
.q{padding:12px 0;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:none}
.q .qt{font-size:13px;font-weight:600;margin-bottom:4px}
.q .qa{font-family:'DM Mono',monospace;font-size:12px;color:var(--gold-lt)}
.q .qn{font-size:11px;color:var(--dim);margin-top:3px}
footer{padding:18px;text-align:center;font-family:'DM Mono',monospace;font-size:9px;color:var(--dim);line-height:2;border-top:1px solid var(--line)}
@media(prefers-reduced-motion:no-preference){.card{animation:fade .25s ease}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand">
    <div class="mark"><span>L</span></div>
    <div><h1>Lucas Trade Intel</h1><small>PAPER LAB · MEASURED, NOT PROMISED</small></div>
  </div>
  <div class="stamp" id="stamp">loading…</div>
</header>
<nav id="nav">
  <button data-t="results" class="on">Results</button>
  <button data-t="scanner">Scanner</button>
  <button data-t="log">Log</button>
  <button data-t="rules">Rules</button>
</nav>
<main id="main"></main>
<footer>Lucas Trade Intel · Paper experiment — no real money<br/>Simulated on the underlying · Not financial advice<br/>© Lucas Heating LLC</footer>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const MIN_N = 30;                       // cells below this show no rate
const HEDGE_COST = 0.1;                 // % per trade drag when hedged
let DB = {log:[], snap:null, meta:null};
let state = {tab:"results", dir:"all", hz:"all", follow:"all", hedge:0};

const fmt$ = v => (v<0?"−$":"+$") + Math.abs(v).toFixed(0);
const fmtP = v => (v>=0?"+":"") + v.toFixed(2) + "%";
const cls = v => v>=0 ? "c-up" : "c-dn";
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function loadData(){
  const bust = "?t=" + Date.now();
  const get = async f => { try{ const r = await fetch("data/"+f+bust); return r.ok ? r.json() : null; }catch{ return null; } };
  const [log, snap, meta] = await Promise.all([get("log.json"), get("snapshot.json"), get("meta.json")]);
  DB = {log: log||[], snap, meta};
  const last = meta?.last_run ? new Date(meta.last_run) : null;
  $("#stamp").innerHTML = last
    ? `last worker run <b>${last.toLocaleString([],{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})}</b> · ${DB.log.filter(t=>t.status==="open").length} open · ${DB.log.filter(t=>t.status==="closed").length} closed`
    : `no worker data yet — finish setup, then this fills in on the first market-hours run`;
  render();
}

/* ── Slicing engine: every view is a filter over the atomic log ── */
function slice(){
  return DB.log.filter(t=>{
    if(state.dir!=="all" && t.direction!==state.dir) return false;
    if(state.hz!=="all" && t.horizon!==state.hz) return false;
    if(state.follow==="trade" && t.decision!=="TRADE") return false;
    if(state.follow==="tw" && t.decision==="SKIP") return false;
    return true;
  });
}
function pnlOf(t){ // hedged overlay computed at view time — never stored
  if(t.status!=="closed") return null;
  let p = t.pnl_pct;
  if(state.hedge>0 && t.spy_entry && t.spy_exit){
    const rSpy = (t.spy_exit/t.spy_entry-1)*100;
    const sgn = t.direction==="BULL"?1:-1;
    p = p - state.hedge/100 * sgn * rSpy - state.hedge/100 * HEDGE_COST;
  }
  return p;
}
function stats(trades){
  const closed = trades.filter(t=>t.status==="closed");
  const pnls = closed.map(pnlOf);
  const alphas = closed.filter(t=>t.excess_pct!=null).map(t=>t.excess_pct);
  const wins = pnls.filter(p=>p>0).length;
  return {
    n: trades.length, nClosed: closed.length, nOpen: trades.length-closed.length,
    dollars: pnls.reduce((a,p)=>a+p/100*500,0),
    winRate: closed.length? wins/closed.length*100 : null,
    avgPnl: closed.length? pnls.reduce((a,b)=>a+b,0)/closed.length : null,
    avgAlpha: alphas.length? alphas.reduce((a,b)=>a+b,0)/alphas.length : null,
    alphaDollars: alphas.reduce((a,x)=>a+x/100*500,0),
  };
}

/* ── RESULTS ── */
function vResults(){
  const s = stats(slice());
  const all = stats(DB.log);
  const tradeOnly = stats(DB.log.filter(t=>t.decision==="TRADE"));
  const enough = s.nClosed >= MIN_N;
  const alphaBig = enough ? fmt$(s.alphaDollars) : "—";

  const seg=(key,opts)=>`<div class="seg">`+opts.map(([v,l])=>
    `<button data-k="${key}" data-v="${v}" class="${state[key]===v?"on":""}">${l}</button>`).join("")+`</div>`;

  const combos = [];
  for(const d of ["BULL","BEAR"]) for(const h of ["intraday","swing","position"]){
    const c = stats(DB.log.filter(t=>t.direction===d&&t.horizon===h));
    combos.push({d,h,c});
  }

  return `
  <div class="card"><div class="alpha">
    <div class="big ${s.alphaDollars<0?"neg":""}">${alphaBig}</div>
    <div class="lab">ALPHA — EXCESS VS SIMPLY OWNING SPY</div>
    <div class="sub">${enough
      ? `${s.nClosed} closed trades in this slice · raw P&amp;L ${fmt$(s.dollars)}`
      : `${s.nClosed} of ${MIN_N} closed trades needed before this number means anything`}</div>
  </div>
  <div class="bd">
    ${seg("dir",[["all","Both"],["BULL","Bulls only"],["BEAR","Bears only"]])}
    ${seg("hz",[["all","All horizons"],["intraday","Same-day"],["swing","1–4 wk"],["position","1 mo+"]])}
    ${seg("follow",[["all","Took everything"],["tw","TRADE + WAIT"],["trade","Followed TRADE only"]])}
    <div class="statgrid" style="margin-top:4px">
      <div class="stat"><div class="v mono">${s.n}</div><div class="k">SIGNALS</div></div>
      <div class="stat"><div class="v mono">${s.nOpen}</div><div class="k">OPEN</div></div>
      <div class="stat"><div class="v mono ${s.winRate!=null&&s.winRate>=50?"":""}" style="color:${s.winRate==null?"var(--dim)":s.winRate>=50?"var(--up)":"var(--dn)"}">${s.winRate==null?"—":s.winRate.toFixed(0)+"%"}</div><div class="k">WIN RATE</div></div>
      <div class="stat"><div class="v mono" style="color:${s.dollars>=0?"var(--up)":"var(--dn)"}">${fmt$(s.dollars)}</div><div class="k">RAW P&amp;L</div></div>
      <div class="stat"><div class="v mono">${s.avgPnl==null?"—":fmtP(s.avgPnl)}</div><div class="k">AVG TRADE</div></div>
      <div class="stat"><div class="v mono" style="color:var(--gold-lt)">${s.avgAlpha==null?"—":fmtP(s.avgAlpha)}</div><div class="k">AVG ALPHA</div></div>
    </div>
  </div></div>

  <div class="card"><div class="hd">HEDGE OVERLAY — COMPUTED, NEVER TRADED</div><div class="bd">
    <div style="display:flex;justify-content:space-between;margin-bottom:6px">
      <span class="note">SPY hedge on every trade</span>
      <span class="mono" style="color:var(--gold-lt)">${state.hedge}%</span>
    </div>
    <input class="slider" type="range" min="0" max="100" step="25" value="${state.hedge}" id="hedgeSlider"/>
    <div class="note" style="margin-top:8px">Drag the slider and every number above recalculates as if each trade carried a ${state.hedge||"0"}% opposite-SPY hedge (${HEDGE_COST}% cost per trade). The log itself stays raw — hedging is a lens, not a position.</div>
  </div></div>

  <div class="card"><div class="hd">COUNTERFACTUAL — DID THE FILTERS EARN THEIR KEEP?</div><div class="bd">
    <div class="row"><span class="note">Followed TRADE calls only</span><span class="mono" style="color:${tradeOnly.dollars>=0?"var(--up)":"var(--dn)"}">${fmt$(tradeOnly.dollars)} <span style="color:var(--dim)">(${tradeOnly.nClosed})</span></span></div>
    <div class="row"><span class="note">Took every signal incl. WAIT/SKIP</span><span class="mono" style="color:${all.dollars>=0?"var(--up)":"var(--dn)"}">${fmt$(all.dollars)} <span style="color:var(--dim)">(${all.nClosed})</span></span></div>
    <div class="note" style="margin-top:8px">${tradeOnly.nClosed<MIN_N||all.nClosed<MIN_N ? "Not enough closed trades yet to compare honestly — check back once both rows pass "+MIN_N+"." : "If the top row doesn't beat the bottom on alpha, the filters are throwing away winners."}</div>
  </div></div>

  <div class="card"><div class="hd">COMBINATION GRID — WIN RATE BY DIRECTION × HORIZON</div><div class="bd">
    <div class="combo">
      ${combos.map(({d,h,c})=>{
        const thin = c.nClosed < MIN_N;
        return `<div class="cell ${thin?"thin":"ok"}">
          <div class="t">${d==="BULL"?"▲":"▼"} ${h==="intraday"?"DAY":h==="swing"?"1–4W":"1M+"}</div>
          <div class="w" style="${thin?"":`color:${(c.winRate||0)>=50?"var(--up)":"var(--dn)"}`}">${thin?`${c.nClosed}/${MIN_N}`:(c.winRate.toFixed(0)+"%")}</div>
          <div class="n">${thin?"collecting":`α ${fmtP(c.avgAlpha??0)}`}</div>
        </div>`;
      }).join("")}
    </div>
    <div class="note" style="margin-top:10px">Dashed cells haven't reached ${MIN_N} closed trades — no rate is shown because a rate on that little data is a coin flip wearing a suit. The best-looking cell of six on small samples is usually just noise: patterns here get <i>watched</i>, then confirmed on the next month of data before anything changes.</div>
  </div></div>

  <div class="card"><div class="hd">EQUITY — REALIZED + OPEN, $500 PER POSITION</div><div class="bd">
    <canvas id="eq" width="440" height="120"></canvas>
    <div class="note" id="eqNote" style="margin-top:6px"></div>
  </div></div>`;
}

function drawEquity(){
  const cv = $("#eq"); if(!cv) return;
  const eq = DB.meta?.equity||[];
  const ctx = cv.getContext("2d");
  ctx.clearRect(0,0,cv.width,cv.height);
  if(eq.length<2){ $("#eqNote").textContent = "Curve appears after the first few worker runs."; return; }
  const vals = eq.map(p=>p.realized+p.open);
  const min = Math.min(...vals,0), max = Math.max(...vals,0);
  const pad = 8, W = cv.width-pad*2, H = cv.height-pad*2;
  const X = i => pad + i/(vals.length-1)*W;
  const Y = v => pad + (1-(v-min)/((max-min)||1))*H;
  ctx.strokeStyle = "rgba(255,255,255,.12)"; ctx.beginPath();
  ctx.moveTo(pad,Y(0)); ctx.lineTo(pad+W,Y(0)); ctx.stroke();
  ctx.strokeStyle = vals[vals.length-1]>=0 ? "#00c896" : "#f0465a";
  ctx.lineWidth = 1.6; ctx.beginPath();
  vals.forEach((v,i)=> i?ctx.lineTo(X(i),Y(v)):ctx.moveTo(X(i),Y(v)));
  ctx.stroke();
  const last = eq[eq.length-1];
  $("#eqNote").textContent = `Now: ${fmt$(last.realized+last.open)} total (${fmt$(last.realized)} realized, ${fmt$(last.open)} open) across ${last.n_open} open positions.`;
}

/* ── SCANNER ── */
function vScanner(){
  const sn = DB.snap;
  if(!sn?.rows?.length) return `<div class="empty"><div class="serif">No scan yet</div><div class="note">The worker publishes a snapshot every 15 minutes during market hours (9:30–4 ET, Mon–Fri).</div></div>`;
  const section=(title,hz,color)=>{
    const rows = sn.rows.filter(r=>r[hz]&&r[hz].direction!=="NEUTRAL").sort((a,b)=>b[hz].score-a[hz].score).slice(0,12);
    if(!rows.length) return "";
    return `<div class="card"><div class="hd" style="color:${color}">${title}</div>${rows.map(r=>{
      const s=r[hz];
      return `<div style="padding:11px 14px;border-bottom:1px solid var(--line)">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <div><span class="tk">${r.ticker}</span> <span class="px">$${r.price?.toFixed(2)} · ${(r.change>=0?"+":"")+r.change?.toFixed(2)}%</span></div>
          <div><span class="chip ${s.direction==="BULL"?"c-up":"c-dn"}">${s.direction}</span>
          <span class="chip ${s.decision==="TRADE"?"c-up":s.decision==="WAIT"?"c-am":"c-mut"}">${s.decision}</span></div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="mono" style="font-size:10px;color:var(--dim);width:52px">score ${s.score}</span>
          <div class="scorebar"><i style="width:${s.score}%;background:${s.score>=70?"var(--up)":s.score>=55?"var(--amber)":"var(--dn)"}"></i></div>
        </div>
        ${s.reasons?.[0]?`<div class="note" style="margin-top:5px">✓ ${esc(s.reasons[0])}</div>`:""}
        ${s.warnings?.[0]?`<div class="warn" style="margin-top:3px">⚠ ${esc(s.warnings[0])}</div>`:""}
      </div>`;
    }).join("")}</div>`;
  };
  return `<div class="note" style="margin-bottom:12px">Snapshot ${new Date(sn.ts).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})} — each horizon is scored by its own signals. Every non-neutral call below was also logged as a paper position automatically.</div>`
    + section("SAME-DAY — VWAP · OPENING RANGE · VOLUME","intraday","#7ab3ff")
    + section("1–4 WEEKS — TREND · MACD · RSI · S/R","swing","var(--up)")
    + section("1 MONTH+ — LONG TREND · 3-MO RETURNS · EARNINGS","position","var(--gold-lt)");
}

/* ── LOG ── */
function vLog(){
  if(!DB.log.length) return `<div class="empty"><div class="serif">Log is empty</div><div class="note">Every signal — TRADE, WAIT and SKIP — lands here as a paper position the moment the worker sees it. Nothing is edited after the fact.</div></div>`;
  const rows = [...DB.log].sort((a,b)=>b.ts_open.localeCompare(a.ts_open)).slice(0,120);
  return `<div class="card">${rows.map(t=>{
    const closed = t.status==="closed";
    return `<div style="padding:11px 14px;border-bottom:1px solid var(--line)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <div><span class="tk">${t.ticker}</span>
          <span class="chip ${t.direction==="BULL"?"c-up":"c-dn"}">${t.direction}</span>
          <span class="chip c-blue">${t.horizon==="intraday"?"DAY":t.horizon==="swing"?"1–4W":"1M+"}</span>
          <span class="chip ${t.decision==="TRADE"?"c-up":t.decision==="WAIT"?"c-am":"c-mut"}">${t.decision}</span></div>
        <span class="mono" style="font-size:12px;color:${closed?(t.pnl_pct>=0?"var(--up)":"var(--dn)"):"var(--mut)"}">${closed?fmtP(t.pnl_pct):"open"}</span>
      </div>
      <div class="px">in $${t.entry?.toFixed(2)} · ${new Date(t.ts_open).toLocaleString([],{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})}${closed?` → out $${t.exit?.toFixed(2)} (${t.exit_reason})`:""}${t.excess_pct!=null?` · α ${fmtP(t.excess_pct)}`:""}</div>
      ${t.spread?`<div class="note" style="margin-top:3px">spread edge ${t.spread.edge>=0?"+":""}${t.spread.edge} (need ${(t.spread.breakeven_prob*100).toFixed(0)}%, market prices ${(t.spread.market_prob*100).toFixed(0)}%)</div>`:""}
    </div>`;
  }).join("")}</div>`;
}

/* ── RULES ── */
function vRules(){
  const q=(id,txt)=>{
    let a="collecting…", n="";
    const closed = DB.log.filter(t=>t.status==="closed");
    if(id===1){
      const b=stats(DB.log.filter(t=>t.direction==="BULL")), r=stats(DB.log.filter(t=>t.direction==="BEAR"));
      if(b.nClosed>=MIN_N&&r.nClosed>=MIN_N) a=`bull α ${fmtP(b.avgAlpha??0)} vs bear α ${fmtP(r.avgAlpha??0)}`;
      n=`${b.nClosed} bull / ${r.nClosed} bear closed of ${MIN_N} each`;
    }
    if(id===2){
      const tr=stats(DB.log.filter(t=>t.decision==="TRADE")), all=stats(DB.log);
      if(tr.nClosed>=MIN_N) a=`TRADE-only α ${fmtP(tr.avgAlpha??0)} vs everything α ${fmtP(all.avgAlpha??0)}`;
      n=`${tr.nClosed} of ${MIN_N} TRADE closes`;
    }
    if(id===3){
      const hs=["intraday","swing","position"].map(h=>stats(DB.log.filter(t=>t.horizon===h)));
      if(hs.every(x=>x.nClosed>=MIN_N)) a=hs.map((x,i)=>`${["day","1–4w","1m+"][i]} ${fmtP(x.avgAlpha??0)}`).join(" · ");
      n=hs.map((x,i)=>`${["day","swing","pos"][i]} ${x.nClosed}`).join(" / ")+` of ${MIN_N} each`;
    }
    if(id===4){
      const hi=closed.filter(t=>t.score>=80), lo=closed.filter(t=>t.score<65);
      if(hi.length>=MIN_N&&lo.length>=MIN_N){
        const w=x=>x.filter(t=>t.pnl_pct>0).length/x.length*100;
        a=`score≥80 wins ${w(hi).toFixed(0)}% vs score<65 wins ${w(lo).toFixed(0)}%`;
      }
      n=`${hi.length} high / ${lo.length} low of ${MIN_N} each`;
    }
    if(id===5){
      const g=closed.filter(t=>t.spread&&t.spread.edge>=0), b2=closed.filter(t=>t.spread&&t.spread.edge<0);
      if(g.length>=MIN_N&&b2.length>=MIN_N) a=`fair-priced α ${fmtP(stats2(g))} vs overpriced α ${fmtP(stats2(b2))}`;
      n=`${g.length} fair / ${b2.length} overpriced of ${MIN_N} each`;
      function stats2(x){const al=x.filter(t=>t.excess_pct!=null).map(t=>t.excess_pct);return al.length?al.reduce((a,b)=>a+b,0)/al.length:0;}
    }
    return `<div class="q"><div class="qt">${txt}</div><div class="qa">${a}</div><div class="qn">${n}</div></div>`;
  };
  return `
  <div class="card"><div class="hd">PRE-REGISTERED QUESTIONS — DATED JULY 27, 2026</div><div class="bd">
    <div class="note" style="margin-bottom:6px">Written down before the first trade. These five get answered by the data; everything else found later is exploratory until it survives a fresh month.</div>
    ${q(1,"1 · Do bull calls beat bear calls on alpha?")}
    ${q(2,"2 · Does following TRADE-only beat taking everything?")}
    ${q(3,"3 · Which horizon carries the edge — same-day, swing, or 1 month+?")}
    ${q(4,"4 · Are high scores (≥80) actually better than low ones (<65)?")}
    ${q(5,"5 · Do fairly-priced spreads (edge ≥ 0) outperform overpriced ones?")}
  </div></div>
  <div class="card"><div class="hd">HOW THIS EXPERIMENT WORKS</div><div class="bd"><div class="note">
    A worker runs every 15 minutes during market hours. It scores three horizons with separate signals, opens a $500 paper position on every non-neutral call (max one per ticker per horizon — up to three thesis-diverse positions per ticker), and records the verdict it gave at that moment: TRADE, WAIT or SKIP. Exits are mechanical: same-day closes by 3:55 ET (±1.2/0.8%), swing at +5/−3% or 10 trading days, long at +10/−6% or 45 days.<br/><br/>
    Alpha means excess over SPY in the trade's direction over the same window — a bull win during a market rally earns no credit for the rally. P&amp;L is simulated on the stock itself; spread pricing is recorded for question 5 but not traded.<br/><br/>
    The log stores facts, never conclusions. Hedges, filters and combinations are lenses applied afterward, so any strategy can be tested against the same history — including ones we haven't thought of yet.
  </div></div></div>`;
}

/* ── Render + events ── */
function render(){
  const m = $("#main");
  m.innerHTML = state.tab==="results"?vResults():state.tab==="scanner"?vScanner():state.tab==="log"?vLog():vRules();
  if(state.tab==="results") drawEquity();
  m.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{state[b.dataset.k]=b.dataset.v;render();});
  const hs = $("#hedgeSlider");
  if(hs) hs.oninput = e=>{state.hedge=+e.target.value;render();};
}
$("#nav").addEventListener("click",e=>{
  const b = e.target.closest("button"); if(!b) return;
  state.tab = b.dataset.t;
  document.querySelectorAll("#nav button").forEach(x=>x.classList.toggle("on",x===b));
  render();
});
loadData();
setInterval(loadData, 5*60*1000); // refresh while the tab is open
</script>
</body>
</html>
